- id: Nolte2026a
  title: "Computational Reproducibility in Sports Science: A Registered Report Reanalysing Private Raw Data"
  authors: "Simon Nolte, Jennifer Murphy, Cristian Mesquida, Daniel Memmert, Robert Rein"
  year: 2026
  venue: "Journal of Sports Sciences (Registered Report Stage 1 accepted)"
  preprint: "https://doi.org/10.17605/OSF.IO/VCWP8"
  materials: "https://github.com/orgs/comprep-sport/"
  abstract: |
    Computational reproducibility, the ability to obtain the same numerical results as an article when analysing the same data with the same methods, is a cornerstone of trustworthy science. Recent findings from sports science suggest that many findings cannot be replicated when collecting new data, but it remains unclear whether sports science findings are reproducible when using the same data. Investigating the reproducibility of sport science studies requires access to the original raw data, but relying only on published data may yield a distorted sample and thus biased estimate of reproducibility. This project aims to estimate the rate of computational reproducibility in sports science and to identify barriers to reproducibility. We will collaborate with the Journal of Sports Sciences to ask authors of accepted articles to confidentially share their raw data. We will reanalyse the primary statistical claims of 50 articles published in the journal and rate their reproducibility in terms of correctness (numerical agreement) and vagueness (ambiguity of methods). Using a logistic multilevel model, this will give us an estimate of the rate of computational reproducibility of primary statistical claims. We will classify barriers to reproducibility and develop recommendations for researchers and editors to improve the reproducibility of published articles. 

- id: Rein2026
  title: 'Comment on "The Practical Value of Bayesian Inference in Describing the Epidemiology of Sports Injuries"'
  authors: "Robert Rein, Simon Nolte, Matthew Schofield"
  year: 2026
  venue: "Sports Medicine"
  link: "https://doi.org/10.1007/s40279-026-02461-0"
  abstract: |
    We are writing in response to the article titled “The Practical Value of Bayesian Inference in Describing the Epidemiology of Sports Injuries” by Chandran and colleagues recently published in Sports Medicine [1]. We commend the authors for their valuable contribution to the field and we fully support the promotion of Bayesian statistics as a practical and useful tool and their endorsement of predictive inferential statistics. However, we feel that there are inaccuracies in their presentation that misrepresent the statistical underpinnings of their argument. We first begin by providing background for applied (parametric) statistical modeling. Where possible, we introduce this in the context of the scenario posed by Chandran et al. [1] where 12 injuries were recorded in 1000 h of football training.

- id: Nolte2022
  title: "The Mathematical Modeling of Lactate Curves from Graded Incremental Exercise Tests"
  authors: "Simon Nolte, Oliver J. Quittmann, Volker Meden"
  year: 2022
  venue: "SportRxiv"
  preprint: "https://doi.org/10.51224/SRXIV.136"
  materials: "https://osf.io/av6gm/"
  abstract: | 
    Purpose: Measuring the blood lactate concentration allows for a glimpse at the metabolic processes during exercise. To extract characteristics of metabolism the relationship between blood lactate concentration and power or velocity is modeled. Current modeling approaches allow only limited interpretation, are in conflict with basic principles of scientific mathematical modeling, and lack a phenomenological reasoning. 
    Methods: We developed a simple analytical expression to model lactate concentration data from graded incremental exercise tests. We compared our new approach to a traditional one in a dataset of N = 24 exercise tests performed by elite junior triathletes.
    Results: The new procedure leads to three independent fitting parameters characterizing the baseline lactate concentration, the intensity (power, velocity) at the onset as well as the rate of increase of the lactate concentration. These parameters have a clear meaning and can directly be used for diagnostics. They can be interpreted with more confidence compared to the characteristics extracted in the traditional approach.
    Conclusion: The performance indicators, naturally appearing in our modeling, should supersede the single points obtained from the traditional evaluation of graded incremental exercise tests (“lactate thresholds”), which can hardly be justified based on the principles of scientific mathematical modeling.
    
- id: Nolte2022c
  title: "Simulation of Steady-State Energy Metabolism in Cycling and Running"
  authors: "Simon Nolte, Oliver J. Quittmann, Volker Meden"
  year: 2022
  venue: "SportRxiv"
  preprint: "https://doi.org/10.51224/SRXIV.110"
  materials: "https://github.com/smnnlt/suppl-metasim"
  abstract: |
    Purpose: A mathematical model to describe the interplay of distinct metabolic rates during exercise was developed decades ago. Despite its use in endurance performance diagnostics, attempts to validate the model’s assumptions and predictions on experimental data are rare. We here provide a comprehensive study of the latter focusing on the steady state.
    Methods: We rewrote the mathematical equations in the steady state and tested them on a data set of N = 160 individuals derived from five studies in cycling and running.
    Results: The rewritten equations reveal a unique relationship between the ratio of the maximum oxygen uptake and the lactate accumulation rate, and the fractional utilization of oxygen uptake at the maximum lactate steady-state. Experimental data for running and cycling do not provide evidence that this relation holds.
    Conclusion: Given the current protocols to measure the maximum lactate accumulation rate, the model predictions cannot be considered as quantitative. Its use in individualized performance diagnostics is thus scientifically questionable. Additional model layers and/or more precise methods of measurement may improve the agreement between the model predictions and the data, but require experimental validation.
    
- id: Nolte2023
  title: "Data Processing Strategies to Determine Maximum Oxygen Uptake: A Systematic Scoping Review and Experimental Comparison with Guidelines for Reporting"
  authors: "Simon Nolte, Robert Rein, Oliver J. Quittmann"
  year: 2023
  venue: "Sports Medicine"
  link: "https://doi.org/10.1007/s40279-023-01903-3"
  materials: "https://github.com/smnnlt/vo2max-processing"
  abstract: |
    Background: Gas exchange data from maximum oxygen uptake (VO2max) testing typically require post-processing. Different processing strategies may lead to varying VO2max values affecting their interpretation. However, the exact processing strategies used in the literature have yet to be systematically investigated. Previous research investigated differences across methods at the group level only.
    Methods: Out of a random sample, we investigated 242 recently published articles that measured VO2max during ramp tests. Reported data processing methods and their rationale were extracted. We compared the most common processing strategies on a data set of 72 standardized exercise tests in trained athletes.
    Results: Half of the included studies did not report their data processing strategy and almost all articles failed to provide a rationale for the particular strategy chosen. Most studies use binned time averages to determine VO2max, with a minority using moving time or moving breath averages. The processing strategies found in the literature can lead to mean differences in VO2max of more than 5% (range 0-7%) with considerable variation at the individual level.
    Conclusion: We advise researchers to change their processing strategy and use moving averages or digital filters instead of binned averages. Researchers should report their data processing strategy used to determine VO2max. We provide a reporting checklist of seven items that can function as a template for reporting.

- id: Nolte2023c
  title: "Positioning and Power Demands During Cycling in a Sprint Triathlon World Championship"
  authors: "Simon Nolte, Oliver J. Quittmann"
  year: 2023
  venue: "SportRxiv"
  preprint: "https://doi.org/10.51224/SRXIV.317"
  abstract: |
    Purpose: To assess the power demands of male elite triathletes during the World Championships and investigate the relationship between power output and positioning at turns.
    Methods: We analyzed power and position data from 5 out of 8 riders of the front group for the 2020 sprint triathlon World Championship. We created power profiles and distributions and investigated the influence of position on power output with Bayesian hierarchical models.
    Results: Athletes of the same bike group experienced different power demands and employed different positioning strategies. With each position further behind during a turn, athletes had a higher peak (+24.2 W [4.8 36.7]; mean [95% credibility interval]) and 10 seconds mean power (+19.3 W [10.5; 27.1]) during the following acceleration. The positioning had a smaller effect on the 20 seconds mean power (+6.3 W [-1.4; 13.6]) and a negative effect on the 20 seconds mean power prior to the turn (-13.4 W [-20.8; -4.99]).
    Conclusion: Positioning during cycling can influence the power demands, which may affect subsequent running performance. Athletes and their coaches should identify positioning strategies that fit the individual abilities best.
    
- id: Nolte2023d
  title: "spiro: An R Package for Analyzing Data from Cardiopulmonary Exercise Testing"
  authors: "Simon Nolte"
  year: 2023
  venue: "Journal of Open Source Software"
  link: "https://doi.org/10.21105/joss.05089"
  materials: "https://github.com/ropensci/spiro/"
  abstract: |
    Measuring gas exchange during physical exercise is a common procedure in sports science and medicine. It allows to assess the functional limit of the cardiovascular system, evaluate the success of training interventions, and diagnose cardio-respiratory diseases. The measuring devices of cardiopulmonary exercise testing — so-called metabolic carts — output their data in different formats. Moreover, measured breath-by-breath data is inherently noisy and requires post-processing. The spiro package standardizes the import and processing of raw data from different metabolic carts.

- id: Nolte2026
  title: "c3dr: An R Package to Read and Write C3D Motion Capture Files"
  authors: "Simon Nolte"
  year: 2026
  venue: "Journal of Open Source Software"
  link: "https://doi.org/10.21105/joss.09951"
  materials: "https://github.com/ropensci/c3dr/"
  abstract: |
    Human motion can be recorded in several ways, including three-dimensional motion capture systems, force platforms, electromyographic measurement devices, and inertial measurement units. These biomechanical measurements are stored and combined in data containers. The standard format for these data containers is the C3D file format. Software for working with C3D files has primarily been limited to programming languages such as C++, Python, or MATLAB. We here present c3dr, an R package for reading and writing C3D files. R is a programming language widely used for statistical modeling and data visualization, and c3dr extends its capabilities to biomechanical data analysis. The package is built on the open C++ library ezc3d (Michaud & Begon, 2021). With c3dr, researchers can use R to modify, visualize, and model biomechanical data stored in C3D files.

- id: Quittmann2023
  title: "Is Maximal Lactate Accumulation Rate Promising for Improving 5000-m Prediction in Running?"
  authors: "Oliver J. Quittmann, Tina Foitschik, Ramin Vafa, Finn Jannis Freitag, Nordin Sparmann, Simon Nolte, Thomas Abel"
  year: 2023
  venue: "International Journal of Sports Medicine"
  link: "https://doi.org/10.1055/a-1958-3876"
  abstract: |
    Endurance running performance can be predicted by maximal oxygen uptake (VO2max), the fractional utilisation of oxygen uptake (%VO2max) and running economy at lactate threshold (REOBLA). This study aims to assess maximal lactate accumulation rate (cLamax) in terms of improving running performance prediction in trained athletes. Forty-four competitive female and male runners/triathletes performed an incremental step test, a 100-m sprint test and a ramp test to determine their metabolic profile. Stepwise linear regression was used to predict 5000-m time trial performance. Split times were recorded every 200-m to examine the 'finishing kick'. Females had a slower t5k and a lower VO2max, cLamax, 'finishing kick' and REOBLA. Augmenting Joyner's model by means of cLamax explained an additional 4.4% of variance in performance. When performing the same analysis exclusively for males, cLamax was not included. cLamax significantly correlated with %VO2max (r=-0.439, p=0.003) and the 'finishing kick' (r=0.389, p=0.010). cLamax allows for significant (yet minor) improvements in 5000-m performance prediction in a mixed-sex group. This margin of improvement might differ in middle-distance events. Due to the relationship to the 'finishing kick', cLamax might be related to individual pacing strategies, which should be assessed in future research.

- id: Quittmann2025
  title: "Biomechanics of Elite Handcyclists Are Highly Individual—a Case Series on Kinetics, Kinematics, and Muscular Activity"
  authors: "Oliver J. Quittmann, Carola Birk, Fabian Göll, Simon Nolte, Thomas Abel"
  year: 2025
  venue: "Frontiers in Sports and Active Living"
  link: "https://doi.org/10.3389/fspor.2025.1581301"
  materials: "https://github.com/smnnlt/push-pull-public"
  abstract: |
    Aim: This study aimed to assess the biomechanics of handcycling propulsion under various exercise modalities in elite handcyclists with special emphasis on the work distribution between the push and pull phases. 
    Methods: Three elite handcyclists in the H3/4 categories (women = 2) performed several lab tests on their own handbikes that were equipped with a powermeter (P9, SRM GmbH) to detect crank torque at 200 Hz. They performed a submaximal graded exercise test, a ramp test until exhaustion, two sprint tests, and a time-to-exhaustion trial at maximum aerobic power. Crank kinetics and joint kinematics were synchronized with surface electromyography of eight upper-extremity muscles.
    Results: The female athletes relied more on the pull phase, while the male handcyclist seemed to favor the push phase (∼10% more work). Shoulder and elbow flexion were almost unaffected by intensity, whereas other shoulder, wrist, and trunk angles changed individually. Even more differences were found in muscular activation patterns between athletes and they demonstrated high variability in the abdominals. During the time-to-exhaustion, we observed intensified work distributions (for the push and pull phases) and constant patterns. Muscular fatigue was identified in different muscles for the three athletes and covered the descending trapezius, abdominals, and anterior deltoid, respectively.
    Conclusion: These findings indicate that the biomechanics of handcycling propulsion are highly individual among elite handcyclists and may be influenced by their classification, handbike setup, and muscular capabilities. We encourage future research to replicate this study in a larger cohort and examine how work distributions and other biomechanical parameters change over time to individualize training prescriptions in athletes.

- id: Severin2026
  title: "Beyond Chronological Age: Maturity Offset Is Positively Associated with Performance in Throwing-Related Tests in Youth Track and Field Throwing Athletes"
  authors: "Jannik Severin, Simon Nolte, Thomas Abel, Marlen Schapschröer"
  year: 2026
  venue: "Frontiers in Sports and Active Living"
  link: "https://doi.org/10.3389/fspor.2026.1765224"
  materials: "https://doi.org/10.5281/zenodo.17591244"
  abstract: |
    Introduction: This study examined the influence of maturity offset, defined as distance from age at peak height velocity, on sport motor test performance in female and male youth track and field throwing athletes aged 13–19 years. The aim was to improve test interpretation and support valid talent identification.
    Methods: A retrospective data analysis was conducted on 468 observations (female: n = 252; male: n = 216) from 379 junior throwing athletes (female: n = 205, age: 15.5 ± 1.2 y; male: n = 174, age: 15.4 ± 1.1 y). Maturity offset was estimated with the widely used non-invasive Mirwald method. Performance was assessed using a standardized test battery including sprints, jumps, power-oriented throwing tests and a 12-minute run. Associations between maturity offset and test performance were analyzed using linear mixed-effects models.
    Results: Higher maturity offset was positively related to performance of throwing-related tests, corresponding to an increase of 12.8% (95% CI: 10.3, 15.3; β = 0.37) in the backward overhead shot throw and 11.9% (95% CI: 9.7, 14.1; β = 0.38) in the forward shot throw for athletes who had a maturity offset that was one year higher than their same-aged peers. Effects on other motor tests were small to trivial (−2.9 to 2.3% performance difference; β = −0.14 to 0.14).
    Discussion: Maturity offset affects physical test outcomes in youth throwers, especially in power-related throwing tasks. These findings highlight the importance of considering maturity offset when interpreting test results to reduce bias in talent identification and better support long-term athlete development.